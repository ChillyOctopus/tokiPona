# ============================================================
# SOURCE:   compiled_sources/wasona/content/en/
#           (basics-1/, basics-2/, basics-3/ lessons and more/ Q&A pages)
# ORIGIN:   wasona, "a crash course in Toki Pona" by kala Asi
#           (git submodule compiled_sources/wasona, commit 4074ab3,
#           digested 2026-10-16)
# AUTHORITY: wasona is THE MOST AUTHORITATIVE grammar
#           reference. Where this file and any other grammar in
#           grammars/ disagree, this file wins.
# COVERAGE: Only what the course teaches or shows: li statements and
#           the mi/sina rule, objects with e, adjectives after the word
#           they describe, pronouns, names, prepositional phrases (as
#           the verb or at the end), preverbs, negation with ala,
#           requests and wishes with o, the call for attention (X o),
#           yes/no questions (V ala V, anu seme), seme questions,
#           answers and interjections (a, n, any phrase), la contexts
#           and la-joined sentences, several li / several e, en between
#           subjects, pi regrouping, numbers (1-2-5 counting, the
#           1-2-5-20-100 "coin" system, ale as x100), ordinals with
#           nanpa, punctuation and capitals, links between sentences.
# NOTES:
#   - Citation on every rule:   # <lesson file> [STATUS] "<example>"
#     Lesson files are relative to compiled_sources/wasona/content/en/.
#     Examples are copied verbatim from a sl="..." attribute or an
#     l2 / alsoAccept exercise field of that file; "(prose)" marks the
#     few taken from lesson text instead.
#   - STATUS:  TAUGHT  the lesson prose states the rule
#              SHOWN   attested in examples only; the prose never states it
#   - "# SILENT:" marks a point wasona does not cover. Those gaps are
#     deliberately NOT filled from other sources; the SILENT section at
#     the end lists them.
#   - wasona avoids jargon "like 'modifier' and 'predicate'"
#     (more/00-01-other-courses.mdx), so rule names use its own words
#     where possible: subject, verb, object, adjective, preverb,
#     preposition, request, call for attention.
#   - Constraints EBNF cannot state (the same word twice in V ala V; a
#     subject that is exactly "mi" or "sina") are CONSTRAINT comments.
#   - The section WRONG / DISCOURAGED / NON-STANDARD is not part of the
#     grammar: it lists validator candidates as patterns.
# ============================================================
#
# NOTATION:
#   NonTerminal   ::= ... ;    production rule
#   "word"                     literal terminal
#   <SET_NAME>                 terminal set (defined below)
#   [ expr ]                   optional (zero or one)
#   { expr }                   zero or more repetitions
#   expr+                      one or more repetitions
#   ( expr )                   grouping
#   A | B                      ordered alternation
#   # text                     comment (lesson citation, status, example)
# ============================================================

# --- TEXT: SENTENCES IN SEQUENCE ---

# basics-1/10-story.mdx [SHOWN] "ni li ike tawa soweli Mumu."
#   A text is a run of sentences. Later sentences point back with ni or
#   ona ("ona li kalama suli tan ni." = "And so he cried out"); a
#   sentence-initial taso ('but') contrasts with the sentence before it
#   (basics-3/28-moo.mdx "mi wile lape. taso mi ken ala.").
# basics-3/24-body.mdx [SHOWN] "palisa luka mi li suli. palisa noka mi li lili."
#   Two sentences side by side make a comparison ("My fingers are
#   larger than my toes."); the course has no comparative construction.
# more/07-02-simpler-cartouches.mdx [SHOWN] "jan T."
#   Initial system: a name is given in full once ("jan Towasi"), then
#   cut to its first letter "in following sentences".
Text
  ::= TextUnit { TextUnit }
    ;

# basics-1/02-writing.mdx [TAUGHT] "sina olin e utala."
#   "sitelen Lasina uses punctuation like English": . ! ? end a
#   sentence. In chat (basics-2/19-dialogue.mdx) end punctuation is often
#   left out and each message is one utterance ("toki a!").
TextUnit
  ::= Utterance [ <SENTENCE_END> ]
    | Announcement
    ;

# basics-1/10-story.mdx [SHOWN] "soweli li kama sona e ni:"
#   ...and the next line is the content: "kalama wawa li tan waso ni."
#   ("She learned this:" / "the noise came from this bird."). Here ni points
#   FORWARD to what follows the colon. Also basics-3/20-time.mdx
#   "sin la mi wile toki e ni:" and more/28-02-uncommon-words.mdx
#   "mi pilin e ni: ..." ("I think that...").
# basics-1/02-writing.mdx [SHOWN] "taso sina sona ala:"
#   ...followed by "utala li ike e sina." -- no "e ni" needed.
# basics-3/29-song.mdx [SHOWN] 'sina toki tawa mi: "mi wile moli"'
#   A colon also introduces quoted speech.
# SILENT: "tan ni:" + clause never appears; "tan ni" only points BACK
#   ("ona li kalama suli tan ni.", basics-1/10-story.mdx).
Announcement
  ::= Utterance ":" ( Utterance [ <SENTENCE_END> ] | Quote )
    ;

# basics-3/29-song.mdx [SHOWN] 'mi toki tawa sina: "ala, o awen tawa mi"'
#   "\"" below is a double quotation mark.
Quote
  ::= "\"" Utterance { [ <SENTENCE_END> ] Utterance } "\""
    ;

# --- UTTERANCE ---

# basics-2/18-feelings.mdx [TAUGHT] "a a a!"
#   a "often goes with other interjections, or in full sentences";
#   basics-3/28-moo.mdx: "n is an interjection just like a, but nasally"
#   ("n... mi sona ala.").
Utterance
  ::= { InterjectionLead } Body
    | <INTERJECTION_WORD>+
    ;

# basics-2/18-feelings.mdx [TAUGHT] "a, ken."
#   Comma optional after a: basics-2/19-dialogue.mdx "a pona".
# basics-3/29-song.mdx [SHOWN] 'mi toki tawa sina: "ala, o awen tawa mi"'
#   Any fragment can lead, before a comma ("ala," = "no,").
InterjectionLead
  ::= <INTERJECTION_WORD> [ "," ]
    | Fragment ","
    ;

# basics-2/12-requests.mdx [SHOWN] "jan Nowa o, soweli sina li wile musi!"
#   The call for attention can come before a complete li-sentence...
# more/28-02-uncommon-words.mdx [SHOWN] "o toki ala e wawa pi tenpo weka, jan nasa o. tenpo open ona la mi lon."
#   ...or after the request (shown once, never explained).
# basics-2/12-requests.mdx [TAUGHT] "jan Ema o!"
#   ...or stand alone: "We can use those separately".
Body
  ::= Sentence [ "," Vocative ]
    | Vocative [ [ "," ] Sentence ]
    | Fragment
    ;

# basics-2/12-requests.mdx [TAUGHT] "jan Ema o!"
#   "The call for someone's attention (before o)". Also
#   basics-3/26-love-identity.mdx "mama o!".
# SILENT: addressing two people at once (en inside a call); "a" after
#   the o of a call.
Vocative
  ::= Phrase "o"
    ;

# basics-2/18-feelings.mdx [TAUGHT] "kama pona!"
#   "Interjections are short phrases that can occur on their own,
#   without a full sentence"; "In the right context, almost anything
#   could be an interjection" ("pipi!", "toki!", "sona.", "lon.").
# basics-2/17-questions.mdx [TAUGHT] "musi ala."
#   Answering a yes/no question: "you reply with the verb for 'yes', and
#   a verb + ala for 'no'" ("musi." / "musi ala."); basics-2/19-dialogue.mdx
#   "jo ala", "ken a!".
# basics-2/19-dialogue.mdx [SHOWN] "tan seme?"
#   A bare prepositional phrase as a question ("why?").
# NOTE: wasona reads "mi wawa." as a statement ("I am strong.",
#   basics-1/06-pronouns.mdx), not as a fragment.
Fragment
  ::= Phrase
    | PrepositionalPhrase
    ;

# --- SENTENCE ---

# basics-3/28-moo.mdx [TAUGHT] "taso mi awen pilin pona."
#   taso: "it can also be put at the beginning of a sentence to mean"
#   'but' (as an ordinary adjective it means 'only').
# basics-3/20-time.mdx [TAUGHT] "pona la utala li pini."
#   Contexts come first (see Context).
# basics-3/29-song.mdx [SHOWN] "taso sina wile e nimi lon la mi tu o tawa weka lon tenpo ni"
#   taso comes before a la-context.
# basics-2/17-questions.mdx [TAUGHT] "sitelen li musi anu seme?"
#   "You can add anu seme at the end of any statement to make it a
#   question"; the asker expects agreement. wasona's reading: a tag on
#   the whole statement, NOT "li musi anu (li) seme".
# SILENT: anu seme after a request (o-sentence).
Sentence
  ::= [ "taso" ] { Context } Clause
    | [ "taso" ] { Context } Statement "anu" "seme"
    ;

# basics-3/20-time.mdx [TAUGHT] "tenpo pini la mi lili."
#   la = "as for ..., speaking of ..., when ..., if ...". The context can
#   be one word ("ken la", "open la", "lipu la", "tenpo la") or a phrase
#   ("tenpo suno kama la").
# basics-3/20-time.mdx [TAUGHT] "suno li pini la, mi lape."
#   "la can also be used between two sentences, joining them into one.
#   The first sentence becomes a condition 'if or when ...', and the
#   second becomes the result". The comma after la is optional
#   ("kon li lete la, pipi li weka." / "ken la ona o lape.").
# basics-3/20-time.mdx [SHOWN] "mi la len ni li pona."
#   A pronoun as the context ("In my opinion, these clothes are nice.").
# more/28-02-uncommon-words.mdx [SHOWN] "telo en nena la tomo li lon insa."
#   en joins the parts of a context.
# more/25-01-large-numbers.mdx [SHOWN] "tenpo sike #LLLTTAMLLLTT la, tenpo mun #LTT la, tenpo suno #W la, ma Tosi li kama utala e ma Posuka."
#   The only example of several contexts in a row.
# basics-3/29-song.mdx [SHOWN] "la mi tu li awen seli"
#   A lyric line may start with la when its context ("tenpo pimeja lete")
#   ended the line before: a line break is not a sentence boundary.
# SILENT: a request (o-clause) used as a context.
Context
  ::= ( Subject | Statement ) "la" [ "," ]
    ;

# --- CLAUSES: STATEMENTS AND REQUESTS ---

# more/06-01-li-and-is.mdx [TAUGHT] "jan li pona."
#   "li tells us something is a statement"; "The opposite of li is o --
#   instead of a statement, it's a command" ("jan o pona!").
Clause
  ::= Statement
    | Request
    ;

# basics-1/03-simple-sentences.mdx [TAUGHT] "soweli li moku e kasi."
#   "li is a particle that starts the verb."
# basics-1/06-pronouns.mdx [TAUGHT] "mi sona e kasi suli."
#   "when mi or sina is the subject of the sentence, we remove the li
#   that would normally follow the subject."
# basics-3/21-nature.mdx [TAUGHT] "jan li alasa e kala, li seli e ona, li moku e ona."
#   Several verbs on one subject, each starting with li; the comma is
#   optional ("akesi li ken lon telo li ken lon ma.").
# CONSTRAINT: the first alternative applies ONLY when the whole subject
#   is the single word mi or sina; every other subject is a MarkedSubject.
# SILENT: a second li-verb after a bare mi/sina subject ("mi X li Y").
Statement
  ::= <UNMARKED_SUBJECT> Predicate
    | MarkedSubject "li" Predicate { [ "," ] "li" Predicate }
    ;

# basics-2/12-requests.mdx [TAUGHT] "ilo o sitelen e waso!"
#   "In a request, instead of li, we use o"; o "starts a request,
#   command, instruction, wish". With no subject the request goes to the
#   listener ("o pini e lupa tomo!"); a wish names what it is about
#   ("pona o tawa sina!" = "May goodness go to you!").
#   "jan Ema o pini e lupa tomo!" is at once the call for attention
#   (before o) and the request (after o).
# basics-2/14-negation.mdx [SHOWN] "ma o utala ala e ma!"
#   Negative request.
# basics-3/21-nature.mdx [SHOWN] "mi o moku e misikeke lon tenpo mute."
#   mi and sina keep o ('I have to ...'); basics-2/19-dialogue.mdx
#   "sina o pali seme?" is a question with o.
# SILENT: several o-verbs ("X o A o B"); li and o in one sentence.
Request
  ::= [ Subject ] "o" Predicate
    ;

# --- SUBJECTS ---

# basics-3/26-love-identity.mdx [TAUGHT] "soweli en waso li utala."
#   en "joins subjects": "we can't just put two subjects next to each
#   other, because you wouldn't know where one subject ends and another
#   begins". Several objects use e ... e and several verbs li ... li.
Subject
  ::= Phrase { "en" Phrase }
    ;

# basics-2/16-society.mdx [TAUGHT] "mi mute li kalama musi."
#   The mi/sina rule "is quite specific!": "Notice how the li isn't
#   dropped. This is because the subject isn't either mi or sina, but
#   instead mi mute and sina mute!" -- "If it was dropped here, we would
#   instead assume mute is the verb." wasona's reading: subject "mi mute".
#   Same with basics-3/25-numbers.mdx "mi tu li kama wan.",
#   basics-3/27-colours.mdx "mi kin li musi kepeken leko kule.",
#   basics-3/28-moo.mdx "mi taso li sona e ni.",
#   basics-3/26-love-identity.mdx "mi en ona li toki.".
# CONSTRAINT: not exactly "mi" and not exactly "sina".
MarkedSubject
  ::= Subject
    ;

# --- THE VERB (PREDICATE) ---

# basics-1/09-activities.mdx [TAUGHT] "waso lili li wile lape."
#   "A preverb is an added verb that goes before the main verb"; "Only a
#   few verbs in Toki Pona are allowed to be preverbs." Preverbs stack
#   ("alasa kama wawa"; exercise "waso li awen wile lape.") and are also
#   normal verbs (basics-2/11-home.mdx "waso sina li wile e moku.").
Predicate
  ::= { Preverb } VerbPhrase
    | YesNoVerb
    ;

# basics-2/14-negation.mdx [TAUGHT] "sina wile ala moku e suwi."
#   ala "also goes on prepositions and preverbs"; "it likes to attach to
#   the first word in the verb".
Preverb
  ::= <PREVERB> [ "ala" ]
    ;

# basics-1/08-prepositions.mdx [TAUGHT] "mi pana e waso tawa kasi."
#   Prepositional phrases: "we can attach them at the end of a sentence", after
#   the objects.
# basics-1/08-prepositions.mdx [TAUGHT] "jan Mili li tan ma Kanse."
#   "Prepositional phrases can come directly after li, and act as the
#   verb all by themselves": tawa 'to go to', lon 'to be at', tan 'to
#   come from'; basics-2/15-with-like.mdx adds "ona li kepeken ilo.".
VerbPhrase
  ::= Verb { Object } { PrepositionalPhrase }
    | PrepositionalPhrase { PrepositionalPhrase }
    ;

# basics-1/05-parts-of-speech.mdx [TAUGHT] "moku li suli e pipi."
#   Any word can be the verb: "if something is a noun, verb, or
#   adjective, it can become any of the three!" A noun or adjective after
#   li includes 'to be' (basics-1/06-pronouns.mdx "ni li suli.").
# basics-1/04-adjectives.mdx [TAUGHT] "waso sona li sona pona e pipi lili."
#   Adjectives go on verbs too: "There is no difference between
#   adjectives and adverbs in Toki Pona."
# more/08-02-named-verbs.mdx [TAUGHT] "jan li toki Inli."
#   A name describes the verb ('speaks English-ly'); without e there is
#   no object.
Verb
  ::= Phrase
    ;

# basics-1/03-simple-sentences.mdx [TAUGHT] "waso li moku e pipi."
#   "e is a particle that starts the object."
# basics-3/21-nature.mdx [TAUGHT] "pan li jo e soweli e kili e namako."
#   "A sentence can have several objects: several e-phrases, which simply
#   go one after the other"; comma optional ("kasi li wile e telo, e
#   suno, e ma.").
Object
  ::= [ "," ] "e" Phrase
    ;

# basics-1/08-prepositions.mdx [TAUGHT] "waso li awen lon kasi."
#   "A preposition + the word it attaches is called a prepositional
#   phrase".
# basics-2/14-negation.mdx [TAUGHT] "pipi li tawa ala kasi."
# basics-2/15-with-like.mdx [TAUGHT] "jan li tawa tomo."
#   vs "jan li tawa e tomo." (tawa as an ordinary verb). With no phrase
#   right after it a preposition is an ordinary word ("toki sina li
#   lon."): "notice how there's no phrase immediately after them!"
# SILENT: a prepositional phrase inside a subject or object phrase; every
#   example attaches it to the verb.
PrepositionalPhrase
  ::= <PREPOSITION> [ "ala" ] Phrase
    ;

# --- QUESTIONS ---

# basics-2/17-questions.mdx [TAUGHT] "pipi li moku ala moku e len?"
#   "We double the first word in the verb, and put an ala in between".
#   The doubled word can be a preverb ("sina wile ala wile lape lon
#   supa?"), a preposition ("ona li lon ala lon ma Mewika?") or the first
#   word of a longer verb (exercise "ni li ilo ala ilo moku?"). It also
#   follows o: basics-3/21-nature.mdx "pan sina o jo ala jo e kili suwi?".
# CONSTRAINT: the two words around ala are the SAME word.
# NOTE: "wile ala wile lape" also matches Preverb Preverb VerbPhrase
#   ('not want to want to sleep'); wasona only ever means the question.
YesNoVerb
  ::= <PREVERB> "ala" <PREVERB> { Preverb } VerbPhrase
    | <PREPOSITION> "ala" <PREPOSITION> Phrase { PrepositionalPhrase }
    | HeadWord "ala" HeadWord { Adjective } { Object } { PrepositionalPhrase }
    ;

# basics-2/17-questions.mdx [TAUGHT] "soweli li utala e jan seme?"
#   seme is "like a blank space in the sentence": "the answer appears in
#   place of seme. Everything else in the sentence stays in the same
#   order!" So seme needs no rule of its own: it is a HeadWord or an
#   Adjective wherever the answer would go -- subject (basics-2/18-feelings.mdx
#   "seme li monsuta e soweli lili?"), verb (more/17-01-doing.mdx
#   "sina seme?"), inside pi (basics-3/23-places.mdx "jan pi mute seme li
#   lon ma Masu?"), after a preposition ("waso li lon seme?").

# --- PHRASES: A WORD AND ITS ADJECTIVES ---

# basics-1/04-adjectives.mdx [TAUGHT] "soweli wawa li moku e kasi suli."
#   "In English, adjectives go before the noun. But in Toki Pona, they
#   always go after"; "the first word is always the most important!"
# basics-3/22-very-lovely-cats.mdx [TAUGHT] "soweli suwi mute"
#   = "many lovely cats": "suwi describes soweli, and mute also describes
#   soweli" -- every adjective describes the FIRST word (flat, not chained).
# basics-1/06-pronouns.mdx [SHOWN] "pipi wawa ni"
#   (alsoAccept "pipi ni wawa"): the order of the adjectives is free.
# SILENT: adjectives after a pi-group; an ordinal followed by more
#   adjectives; an ordinal and a pi-group in the same phrase.
Phrase
  ::= HeadWord { Adjective } [ Ordinal ] [ PiGroup ]
    ;

# basics-1/05-parts-of-speech.mdx [TAUGHT] "soweli suli li sona e suli soweli."
#   Any word can come first: "suli soweli" = "the size of an animal".
# basics-1/06-pronouns.mdx [TAUGHT] "ni li soweli."
#   Pronouns "behave just like normal nouns and adjectives" in most
#   positions; ni is a pronoun and a subject.
# basics-2/15-with-like.mdx [TAUGHT] "mi sona ala e tan."
#   The five prepositions "can all be regular nouns, verbs, or
#   adjectives!"; preverbs "can be both preverbs and normal verbs!"
#   (basics-1/09-activities.mdx).
# basics-2/19-dialogue.mdx [SHOWN] "poki lete mi li jo e ala"
#   ala as a noun ('there is nothing in my fridge').
# more/07-01-make-a-name.mdx [TAUGHT] (prose) "all names are adjectives.
#   They always have to be used with a noun -- we call this a head noun."
#   So <NAME> is never a HeadWord (basics-1/07-names.mdx "jan Nowa").
# SILENT: taso or kin as the first word (shown only after another word).
HeadWord
  ::= <CONTENT_WORD>
    | <PRONOUN>
    | <PREPOSITION>
    | <PREVERB>
    | <NUMBER_WORD>
    | "seme"
    | "ala"
    | "nanpa"
    ;

# basics-1/04-adjectives.mdx [TAUGHT] "pipi ike li moku lili e soweli."
#   Any HeadWord can describe the word before it ("moku lili" = 'to bite
#   a little').
# basics-1/07-names.mdx [TAUGHT] "jan Sunita li sitelen e pipi."
#   "Names are adjectives: they come after another word." A name can be
#   several capitalised words: more/07-01-make-a-name.mdx (prose)
#   "jan Ke Tami".
# basics-2/14-negation.mdx [TAUGHT] "jan ala li wile utala."
#   ala: "it's a pretty normal adjective! And like any other adjective, it
#   goes after the word".
# basics-3/28-moo.mdx [TAUGHT] "mi taso li sona e ni."
#   taso as an adjective = 'only'.
# basics-3/27-colours.mdx [TAUGHT] "kasi kin li laso."
#   kin = 'also, too', after the word it is about.
# basics-2/18-feelings.mdx [TAUGHT] "mi sona ala a e ni!"
#   a "emphasises whatever it comes after"; also "suwi a!".
# basics-3/25-numbers.mdx [TAUGHT] "soko tu tu"
#   "Usually, numbers are just adjectives".
# basics-2/16-society.mdx [TAUGHT] "sina mute"
#   mute attaches to the pronouns mi, sina, ona "quite frequently".
Adjective
  ::= HeadWord
    | <NAME>+
    | Number
    | <NUMBER_ABBREV>
    | "taso"
    | "kin"
    | "a"
    ;

# basics-3/25-numbers.mdx [TAUGHT] "soko nanpa tu tu"
#   "To make ordinal numbers, just use nanpa + a number"; "nanpa is
#   special! It doesn't need pi." Also exercise "mun nanpa tu tu li open.".
Ordinal
  ::= "nanpa" Number
    ;

# basics-3/22-very-lovely-cats.mdx [TAUGHT] "soweli pi suwi mute"
#   pi is "a particle that groups adjectives", "like opening a bracket":
#   'cat (sweet many)' = "a very lovely cat".
# basics-3/23-places.mdx [TAUGHT] "soweli pi jan Ema"
#   "since pi only exists for rebracketing, it will never occur before
#   just one word! There are always two words or more after it." Without
#   pi "the name instead applies to the first word" ("soweli jan Ema" =
#   "A human-like dog named Emma (???)"). pi is common before names and
#   after place words ("o tawa insa pi tomo mi!").
# SILENT: a second pi in the same phrase; a pi inside a pi-group.
PiGroup
  ::= "pi" HeadWord Adjective { Adjective }
    ;

# --- NUMBERS ---

# basics-3/25-numbers.mdx [TAUGHT] "luka tu wan"
#   (= eight) wan 1, tu 2, luka 5, used "like coins worth 1, 2, and 5":
#   "tu wan" 3, "tu tu" 4, "luka wan" 6 ... "luka luka" 10. Every example
#   puts the bigger coins first [SHOWN; never stated as a rule]. In this
#   lesson mute = "many" and ale = "all, every".
# more/25-01-large-numbers.mdx [TAUGHT] "mute mute mute luka luka luka tu wan"
#   (= 78) "we use words wan, tu, luka, mute, ale, as if they were coins
#   worth 1, 2, 5, 20, and 100"; "most of the time, we only really need
#   three number words: wan, tu, mute."
# more/25-01-large-numbers.mdx [TAUGHT] "mute ale mute luka"
#   (= 2025) The 2021 "expanded and backward-compatible system" (linked
#   to the nasin_nanpa_pona wiki page): "instead of adding 100, ale
#   multiplies the previous number by 100" ("luka luka luka ale" = 1500),
#   like two-digit pairs "joining them using ale". The old additive 1500
#   is fifteen ale in a row (second alternative).
# SILENT: ala as zero; writing an all-zero digit pair (e.g. 10 000);
#   whether smaller-first order ("wan tu") is wrong.
Number
  ::= NumberGroup { "ale" [ NumberGroup ] }
    | "ale" { "ale" }
    ;

# basics-3/25-numbers.mdx [SHOWN] "luka tu tu"
# CONSTRAINT: at least one word.
NumberGroup
  ::= { "mute" } { "luka" } { "tu" } { "wan" }
    ;

# --- PUNCTUATION AND CAPITALS (conventions, not rules) ---
# basics-1/02-writing.mdx [TAUGHT] "utala li ike e sina."
#   "Sentences in sitelen Lasina start with lowercase letters, unlike
#   English!"; "sitelen Lasina uses punctuation like English, but sitelen
#   pona doesn't." An editor's comment hidden in the same file says no
#   standard for punctuation existed yet (August 2025).
# basics-1/07-names.mdx [TAUGHT] "jan Ema"
#   "Names start with a capital letter. If you spot a capitalised word in
#   Toki Pona, you immediately know it's a name!" -- even when it is
#   spelled like a course word ("jan Ali li pona e supa kepeken ko.",
#   basics-2/15-with-like.mdx; "mi toki e nimi Pona.",
#   more/28-02-uncommon-words.mdx).
# Commas, all optional, never ending a sentence:
#   after la ...... basics-3/20-time.mdx "kon li lete la, pipi li weka."
#   before li/e ... basics-3/21-nature.mdx "jan li toki, li musi, li kalama, li lape."
#   after a call .. basics-2/12-requests.mdx "jan Nowa o, soweli sina li wile musi!"
#   after a ....... basics-2/18-feelings.mdx "a, ken."
#   before a call . more/28-02-uncommon-words.mdx "o toki ala e wawa pi tenpo weka, jan nasa o. tenpo open ona la mi lon."
# "?" ends questions, "!" requests and exclamations, ":" an
# Announcement, "..." a hesitation (basics-3/28-moo.mdx "n... mi sona ala.").

# ============================================================
# WRONG / DISCOURAGED / NON-STANDARD   (validator candidates)
#   W = the course calls it wrong            (ERROR candidate)
#   D = the course discourages it            (WARNING / INFO candidate)
#   N = non-standard or uncommon, not wrong  (INFO candidate)
# These patterns are NOT part of the grammar above.
# ============================================================

# W1  pi before a single word.
# basics-3/23-places.mdx [TAUGHT] "it will never occur before just one
#   word! There are always two words or more after it." (prose)
#   Correct: basics-3/22-very-lovely-cats.mdx "tomo pi jan lili".
#   validator.py: pi-single-word (ERROR). parser.py has no pi inside a pi
#   group, so a second pi can't hide it ("jan pi wawa pi pona mute").
Wrong_PiSingleWord
  ::= "pi" HeadWord                  # with no Adjective after it
    ;

# W2  li after a subject that is exactly mi or sina.
# basics-1/06-pronouns.mdx [TAUGHT] "we remove the li that would
#   normally follow the subject." (prose)  Correct: "mi wawa.".
Wrong_LiAfterBareMiSina
  ::= <UNMARKED_SUBJECT> "li"        # at the start of a clause
    ;

# W3  A name used without a head noun (as the first word of a phrase).
# more/07-01-make-a-name.mdx [TAUGHT] "They always have to be used with a
#   noun -- we call this a head noun." (prose); basics-1/07-names.mdx:
#   "Names are adjectives: they come after another word."
#   Correct: basics-1/07-names.mdx "jan Ema li sona pona e ma Tosi.".
Wrong_NameAsHeadWord
  ::= <NAME>                         # in HeadWord position
    ;

# W4  A capitalised ordinary word (English-style sentence start).
# basics-1/02-writing.mdx [TAUGHT] "Sentences in sitelen Lasina start with
#   lowercase letters, unlike English!" (prose) A capital marks a name
#   (basics-1/07-names.mdx), so a capitalised word in HeadWord position
#   is either W3 or this. Correct: "sina olin e utala.".
#   Do NOT lowercase a capitalised word that follows a head noun: it is a
#   name ("jan Ali", "nimi Pona"; see PUNCTUATION AND CAPITALS).
Wrong_CapitalisedWordFirst
  ::= <CAPITALISED_WORD>             # in HeadWord position
    ;

# W5  Name shapes Toki Pona does not allow.
# more/07-01-make-a-name.mdx [TAUGHT] "every consonant in your word must
#   come before a vowel" (only n may follow a vowel); "the sequences [wu
#   wo ji ti] never occur in Toki Pona words"; adjacent vowels get j or w
#   ("Nihon (Japan) -> Nion -> Nijon"). (prose)
#   Correct: basics-1/07-names.mdx "jan Sunita li toki Kanse e ma Nijon.".
#   Not names, so exempt: <NAME_INITIAL> "jan T." (more/07-02) and
#   <NUMBER_ABBREV> "#LTT" (more/25-01).
Wrong_NameShape
  ::= <CAPITALISED_WORD>             # that does not match <NAME>
    ;

# W6  Moving seme to the front (English word order).
# basics-2/17-questions.mdx [TAUGHT] "Everything else in the sentence
#   stays in the same order! This is unlike English, where question words
#   (wh-words) move themselves first in the sentence." (prose)
#   Correct: "waso li lon seme?". seme as the real subject is fine
#   (basics-2/18-feelings.mdx "seme li monsuta e soweli lili?").
#   validator.py: seme-fronted (ERROR) for a bare phrase seme + mi/sina +
#   verb ("seme sina moku?"); other orders are too ambiguous to flag.
Wrong_SemeFronted
  ::= "seme" Clause                  # seme placed before a complete clause
    ;

# W7  Adjective before the word it describes (English order).
# basics-1/04-adjectives.mdx [TAUGHT] "In English, adjectives go before the
#   noun. But in Toki Pona, they always go after" (prose). Not detectable
#   by syntax ("suli soweli" is grammatical = "the size of an animal",
#   basics-1/05-parts-of-speech.mdx); a translator / learner hint only.

# D1  li left out after "mi mute" / "sina mute".
# basics-2/16-society.mdx [TAUGHT] "If it was dropped here, we would
#   instead assume mute is the verb." (prose) Correct: "sina mute li sona
#   e ni.". The li-less string still parses (mi + verb "mute ..."); the
#   project makes it an ERROR anyway (validator.py, mi-mute-li).
Discouraged_MiMuteWithoutLi
  ::= <UNMARKED_SUBJECT> "mute" Phrase    # and no li follows
    ;

# D2  A name joined to a later word without pi (meant as possession).
# basics-3/23-places.mdx [TAUGHT] "soweli jan Ema"
#   = "A human-like dog named Emma (???)"; "If you don't use pi, the name
#   instead applies to the first word! And that can turn out to be silly."
#   Intended: "soweli pi jan Ema" = "Emma's dog". Grammatical; hint only.
#   validator.py: name-without-pi (WARNING); also wasona's "toki jan Mili".
Discouraged_NameWithoutPi
  ::= HeadWord "jan" <NAME>+          # HeadWord is not jan
    ;

# D3  Repeating the verb as the object to name a language or game.
# more/08-02-named-verbs.mdx [TAUGHT] "jan li toki e toki Inli."
#   = "The person speaks about English." and "jan li musi e musi Manka."
#   = "The person entertains Minecraft. (???)": "nowadays, the meaning
#   might be understood a bit different from what you want". Prefer "jan
#   li toki Inli." or "jan li toki kepeken toki Inli.".
#   validator.py: named-verb (WARNING).
Discouraged_VerbObjectSameWord
  ::= Verb "e" Phrase                 # Phrase starts with the Verb's word + <NAME>
    ;

# D4  One-syllable names.
# more/07-01-make-a-name.mdx [TAUGHT] (prose) "Toki Pona likes to avoid
#   such short names, because there are too few possible ones"; "It's best
#   to start with a name between two and four syllables long."
#   validator.py: short-name (INFO): it is advice for choosing a name, and
#   other people's short names ("jan Ken") are still their names.
Discouraged_ShortName
  ::= <NAME>                          # of one syllable
    ;

# N1  The four less-used preverbs.
# more/09-01-more-preverbs.mdx [TAUGHT] "mi lukin sona e nimi."
#   sona, open, pini, lukin "are worth knowing, but not everyone uses
#   them"; "they're not super necessary". For trying, 70% of speakers
#   "only use alasa" ("mi alasa sona e nimi.").
#   validator.py: less-common-preverb (INFO).
NonStandard_LessCommonPreverb
  ::= <PREVERB_LESS_COMMON> VerbPhrase
    ;

# N2  Uncommon or obscure words (lexical, listed for completeness).
# more/28-02-uncommon-words.mdx [TAUGHT] (prose) "less commonly used, but
#   still in use by some -- by at least about 10% of Toki Pona speakers";
#   each comes with a core-word alternative (lanpan -> "kama jo", ali ->
#   ale, san / po -> the counting in basics-3/25-numbers.mdx, te / to ->
#   a capitalised word after nimi: "mi toki e nimi Pona.").
#   validator.py: uncommon-word (INFO), from the usage tiers in
#   master_dictionary.yaml (core + common = the course's 131 words).
NonStandard_UncommonWord
  ::= <UNCOMMON_WORD>
    ;

# Semantic notes for a future translator (not syntax):
# - more/06-01-li-and-is.mdx: li does not mean 'is' -- "Unfortunately,
#   this is incorrect!" (about "waso li pona." = "The bird is good.").
# - basics-2/15-with-like.mdx, translator note hidden in an MDX comment:
#   "kepeken is *not* used when you are doing something alongside
#   someone, e.g.: "I am walking with Emma.""

# ============================================================
# SILENT -- what wasona never shows or explains
# parser.py and the other grammars in grammars/ have rules for some of
# these. They are NOT confirmed by wasona and are left out above.
# ============================================================
# - anu anywhere except the tag "anu seme": no "X anu Y" between phrases,
#   subjects or verbs (anu is taught only as the word 'or',
#   basics-2/17-questions.mdx).
# - en anywhere except between subjects or inside a la-context: never
#   between objects (e ... e) or verbs (li ... li), never sentence-initial.
# - a second li-verb after a bare mi / sina subject ("mi X li Y").
# - several o-verbs ("X o A o B"); li and o in one sentence.
# - an o-clause as a la-context; anu seme after an o-sentence.
# - a second pi in one phrase; pi inside a pi-group (parser.py rules this one
#   out, see W1); adjectives after a pi-group; an ordinal together with a
#   pi-group.
# - a prepositional phrase inside a subject or object phrase.
# - ala as the number zero; all-zero digit pairs (10 000).
# - taso or kin as the first word of a phrase; kin at the start of a
#   sentence.
# - n anywhere except at the start of an utterance; "a" right after the
#   o of a call ("X o a").
# - addressing two people at once (en inside a call).
# - the nm / nn ban on names used by validator.py's _PROPER_RE.
# - "tan ni:" + clause (tan ni only points back).
# - V ala V that doubles any word other than the first word of the verb.
# - a standard punctuation system (none existed as of August 2025).

# --- TERMINAL SETS ---
# Every list is wasona's own; the source file is cited above each set.

# basics-1/06-pronouns.mdx -- "Learn ni, mi, sina, ona!"
#   more/17-01-doing.mdx also calls ni, ijo and seme "pronouns": generic
#   stand-ins that can be verbs ("mi ni." = "I'm doing this.").
<PRONOUN>
  = "mi" | "sina" | "ona" | "ni"
  ;

# basics-1/06-pronouns.mdx -- the subjects that drop li (whole subject only)
<UNMARKED_SUBJECT>
  = "mi" | "sina"
  ;

# basics-1/09-activities.mdx + more/09-01-more-preverbs.mdx --
#   "these five preverbs are widely used"
<PREVERB_COMMON>
  = "wile" | "ken" | "kama" | "awen" | "alasa"
  ;

# more/09-01-more-preverbs.mdx -- "four other preverbs that are worth
#   knowing, but not everyone uses them"
<PREVERB_LESS_COMMON>
  = "sona" | "open" | "pini" | "lukin"
  ;

<PREVERB>
  = <PREVERB_COMMON> | <PREVERB_LESS_COMMON>
  ;

# basics-1/08-prepositions.mdx (tawa, lon, tan) + basics-2/15-with-like.mdx
#   (kepeken, sama) -- "Now that you know all five prepositions"
<PREPOSITION>
  = "tawa" | "lon" | "tan" | "kepeken" | "sama"
  ;

# more/25-01-large-numbers.mdx -- "coins worth 1, 2, 5, 20, and 100"
#   (basics-3/25-numbers.mdx counts with wan, tu, luka only)
<NUMBER_WORD>
  = "wan" | "tu" | "luka" | "mute" | "ale"
  ;

# more/25-01-large-numbers.mdx -- "you can also abbreviate large numbers
#   as W, T, L, M, A", written after a hash sign ("tenpo mun #LTT la").
#   \x23 below is the hash sign.
<NUMBER_ABBREV>
  = /^\x23[WTLMA]+$/
  ;

# The words the course calls particles: li, e (basics-1/03-simple-sentences.mdx),
#   pi (basics-3/22-very-lovely-cats.mdx), en (basics-3/26-love-identity.mdx).
<PARTICLE>
  = "li" | "e" | "pi" | "en"
  ;

# Other structure words; the course does not call them particles:
#   o (basics-2/12-requests.mdx), anu (basics-2/17-questions.mdx),
#   la (basics-3/20-time.mdx).
<STRUCTURE_WORD>
  = "o" | "anu" | "la"
  ;

# basics-2/18-feelings.mdx "One special interjection, however, is a"
#   + basics-3/28-moo.mdx "n is an interjection just like a"
<INTERJECTION_WORD>
  = "a" | "n"
  ;

# The open class: the rest of the course's 131 words (the "Learn ...!"
#   lists of lessons 03-28; "You've learned 131 words",
#   basics-3/29-song.mdx), minus the sets above and seme, ala, nanpa,
#   taso, kin, which the rules name directly. basics-1/05-parts-of-speech.mdx:
#   "if something is a noun, verb, or adjective, it can become any of the
#   three!" -- so the course has no noun / verb / adjective split.
<CONTENT_WORD>
  = "akesi" | "anpa" | "ante" | "esun" | "ijo" | "ike" | "ilo" | "insa"
  | "jaki" | "jan" | "jelo" | "jo" | "kala" | "kalama" | "kasi"
  | "kijetesantakalu" | "kili" | "kipisi" | "kiwen" | "ko" | "kon" | "ku"
  | "kule" | "kulupu" | "kute" | "lape" | "laso" | "lawa" | "leko" | "len"
  | "lete" | "lili" | "linja" | "lipu" | "loje" | "lupa" | "ma" | "mama"
  | "mani" | "meli" | "mije" | "misikeke" | "moku" | "moli" | "monsi"
  | "monsuta" | "mu" | "mun" | "musi" | "namako" | "nasa" | "nasin"
  | "nena" | "nimi" | "noka" | "olin" | "pakala" | "pali" | "palisa"
  | "pan" | "pana" | "pilin" | "pimeja" | "pipi" | "poka" | "poki"
  | "pona" | "pu" | "seli" | "selo" | "sewi" | "sijelo" | "sike" | "sin"
  | "sinpin" | "sitelen" | "soko" | "soweli" | "suli" | "suno" | "supa"
  | "suwi" | "telo" | "tenpo" | "toki" | "tomo" | "tonsi" | "unpa" | "uta"
  | "utala" | "walo" | "waso" | "wawa" | "weka"
  ;

# more/28-02-uncommon-words.mdx -- used by "at least about 10%" of
#   speakers, not taught (see N2). wuwojiti is only a mnemonic.
<UNCOMMON_WORD>
  = "lanpan" | "meso" | "oko" | "epiku" | "su" | "majuna" | "jasima"
  | "linluwi" | "nimisin" | "ali" | "kokosila" | "usawi" | "kiki"
  | "puwa" | "apeja" | "powe" | "omekapo" | "isipin" | "te" | "to"
  | "yupekosi" | "san" | "po" | "kamalawala" | "wasoweli" | "kapesi"
  | "unu"
  ;

# Any word written with a capital first letter (input to W3 / W4 / W5).
<CAPITALISED_WORD>
  = /^[A-Z][a-zA-Z]*$/
  ;

# basics-1/07-names.mdx + more/07-01-make-a-name.mdx (see W5):
#   syllables are (consonant) vowel (n); no wu wo ji ti; no two vowels
#   side by side. SILENT: the nm / nn ban in validator.py's _PROPER_RE.
<NAME>
  = /^(?:(?!Wu|Wo|Ji|Ti)[MNPTKSWLJ][aeiou]|[AEIOU])n?(?:(?!wu|wo|ji|ti)[mnptkswlj][aeiou]n?)*$/
  ;

# more/07-02-simpler-cartouches.mdx -- initial system, "jan T."
<NAME_INITIAL>
  = /^[A-Z]\.$/
  ;

# basics-1/02-writing.mdx -- "punctuation like English"
<SENTENCE_END>
  = "." | "!" | "?" | "..."
  ;
