# ============================================================
# MASTER TOKI PONA DICTIONARY
# Auto-generated by build_dictionary.py
#
# Sources:
#   linku.json                    authoritative metadata, ku community translations
#   the_good_stuff_dictionary.txt  rich POS senses, preverbs, la-meanings
#   dictionary.txt                transitive/intransitive verb distinction
#   cheat_sheet.txt               brief canonical glosses
#   wasona/content/en/**/*.mdx    pedagogical glosses from Astro course
#
# POS TAGS used in 'senses':
#   n    noun            m    modifier (adjective or adverb)
#   vt   transitive verb vi   intransitive verb
#   v    verb (unspecified transitivity)
#   a    preverb / auxiliary verb
#   p    preposition     f    function / particle
#   #    numeric value   i    interjection
#   c    conjunction     la   meaning when standing alone before la
#   kama  kama + V compound  other  uncategorised special usage
#
# FIELDS:
#   word          Toki Pona word
#   brief         one-line gloss (cheat sheet > wasona > first sense)
#   usage         core | common | uncommon | obscure
#   see_also      related/merged words
#   pu_alt        pu-recommended replacement for non-pu words
#   definition    linku community definition
#   wasona        pedagogical gloss from the wasona Toki Pona course
#   senses        list of {pos, gloss, sources}
#   ku_data       community translation frequencies 0-100 (sorted desc)
#   notes         usage notes, history, caveats
# ============================================================

